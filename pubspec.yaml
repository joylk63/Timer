name: pomodoro_timer
description: "A feature-rich Pomodoro Timer app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.2.8
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1" # প্যাকেজ যোগ করা হলো

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png" # আপনার ছবির সঠিক পাথ
